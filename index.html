<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青創企劃書產生器</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1c2733;--mut:#6b7684;--acc:#1f6f78;--line:#ddd8c8}
@media (prefers-color-scheme:dark){:root{--bg:#14191f;--card:#1d242c;--ink:#e8ecef;--mut:#9aa6b2;--acc:#52b3bd;--line:#33404c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:150px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:19px;margin:0 0 8px}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit}
select{flex:1;min-width:160px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button,.btn{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.ghost{margin:4px 6px 4px 0;font-size:14px}
main{max-width:860px;margin:0 auto;padding:12px 16px}
details.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:0 14px}
summary{padding:14px 0;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:0 0 14px}
.wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--mut)}
.f input,.f select,.f textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px;width:100%}
.f small,.note{color:var(--mut);font-size:13px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chk{display:flex;gap:8px;align-items:center;padding:8px 0}
h4{margin:6px 0 0;font-size:15px}
#bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px;text-align:center}
#gen{background:var(--acc);color:#fff;border:0;font-weight:700;padding:13px 28px;font-size:17px;width:100%;max-width:520px}
#gen:disabled{opacity:.6}
#sum{font-size:13px;color:var(--mut);margin-top:6px;max-width:860px;margin-inline:auto}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90%}
#toast.show{opacity:1}
@media(max-width:620px){.grid{grid-template-columns:1fr}.row3{grid-template-columns:1fr}}
</style></head><body>
<header><h1>青創企劃書產生器</h1>
<div class="bar"><select id="caseSel"></select>
<button id="newBtn">＋新案件</button><button id="dupBtn">複製</button><button id="delBtn">刪除</button>
<button id="expBtn">匯出案件檔</button><label class="btn">匯入<input id="impFile" type="file" accept=".json" hidden></label></div></header>
<main><div id="form"></div></main>
<div id="bottom"><button id="gen">產生 Word 檔</button><div id="sum"></div></div>
<div id="toast"></div>

const wanPlain = n => { const v = n / 10000; return (Math.abs(v - Math.round(v)) < 1e-9 ? v.toFixed(0) : v.toFixed(1)) + '萬'; };
const pct = (x, d = 1) => (x * 100).toFixed(d) + '%';
const spaced = c => ({ '周轉性支出': '周 轉 性 支 出', '資本性支出': '資 本 性 支 出' }[c] || c);
function monthlyPayment(P, ratePct, years, grace = 0) {
  const r = ratePct / 100 / 12, n = Math.round((years - grace) * 12);
  if (n <= 0) return 0; if (r === 0) return P / n;
  return P * r / (1 - Math.pow(1 + r, -n));
}
const parseXml = s => new DOMParser().parseFromString(s, 'application/xml');
const ser = n => new XMLSerializer().serializeToString(n);
const wq = (el, name) => [...el.children].filter(c => c.localName === name && c.namespaceURI === W);

/* ---------- 表格操作 ---------- */
function setTc(tc, text) {
  const ps = wq(tc, 'p'); const p = ps[0];
  ps.slice(1).forEach(x => tc.removeChild(x));
  let rp = null;
  for (const r of wq(p, 'r')) { const x = wq(r, 'rPr')[0]; if (x) { rp = x.cloneNode(true); break; } }
  if (!rp) { const ppr = wq(p, 'pPr')[0]; const x = ppr && wq(ppr, 'rPr')[0]; if (x) rp = x.cloneNode(true); }
  [...p.children].forEach(c => { if (c.localName !== 'pPr') p.removeChild(c); });
  const doc = p.ownerDocument;
  const r = doc.createElementNS(W, 'w:r');
  if (rp) { wq(rp, 'rFonts').forEach(f => f.removeAttributeNS(W, 'hint')); r.appendChild(rp); }
  const t = doc.createElementNS(W, 'w:t'); t.setAttribute('xml:space', 'preserve'); t.textContent = String(text);
  r.appendChild(t); p.appendChild(r);
}
const trs = tbl => wq(tbl, 'tr');
const cells = (tbl, row) => wq(trs(tbl)[row], 'tc');

/* ---------- 內容建構 ---------- */
class Builder {
  constructor(tlib) {
    this.out = []; this.heads = []; this.bm = 9000; this.h2n = 0; this.curNum = null;
    this.tlib = tlib; this.numXml = null; this.maxNum = 0;
    this.page = 4; this.lines = 0; this.est = {};   // 頁碼估算
  }
  push(x) { this.out.push(x); }
  // --- 頁碼估算 ---
  addLines(n) { this.lines += n; while (this.lines > 34) { this.lines -= 34; this.page++; } }
  newPage() { if (this.lines > 0) { this.page++; this.lines = 0; } }
  textLines(t, left = 0) { const per = Math.max(8, Math.floor((8300 - left) / 262)); return Math.max(1, Math.ceil(String(t).length / per)); }
  newH2Num() { this.maxNum += 1; const id = this.maxNum; this.numXml.push(`<w:num w:numId="${id}"><w:abstractNumId w:val="17"/><w:lvlOverride w:ilvl="0"><w:startOverride w:val="1"/></w:lvlOverride></w:num>`); return id; }
  heading(text, level, numText = '') {
    this.bm++; const name = '_Toc' + (this.bm + 170000000);
    this.heads.push({ level, numText, text, name, page: this.page + (this.lines > 31 ? 1 : 0) });
    return [this.bm, name];
  }
  h1(text, pagebreak = true) {
    if (pagebreak) this.newPage();
    const [id, name] = this.heading(text, 1);
    this.push(`<w:p><w:pPr><w:pStyle w:val="1"/><w:spacing w:line="360" w:lineRule="auto"/></w:pPr>${pagebreak ? '<w:r><w:br w:type="page"/></w:r>' : ''}<w:bookmarkStart w:id="${id}" w:name="${name}"/><w:r><w:t>${esc(text)}</w:t></w:r><w:bookmarkEnd w:id="${id}"/></w:p>`);
    this.h2n = 0; this.curNum = null; this.addLines(2.2);
  }
  h2(text, restart = false) {
    if (this.curNum === null || restart) { this.curNum = this.newH2Num(); this.h2n = 0; }
    this.h2n++;
    const [id, name] = this.heading(text, 2, this.h2n + '.');
    this.push(`<w:p><w:pPr><w:pStyle w:val="2"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="${this.curNum}"/></w:numPr></w:pPr><w:bookmarkStart w:id="${id}" w:name="${name}"/><w:r><w:t>${esc(text)}</w:t></w:r><w:bookmarkEnd w:id="${id}"/></w:p>`);
    this.addLines(1.4);
  }
  para(text = '', o = {}) {
    const { left = 0, line = 360, jc = 'both', bold = false, sz = 28 } = o;
    const ind = left ? `<w:ind w:left="${left}"/>` : '';
    this.push(`<w:p><w:pPr><w:spacing w:line="${line}" w:lineRule="auto"/>${ind}<w:jc w:val="${jc}"/>${rpr(sz, bold)}</w:pPr>${text === '' ? '' : run(text, sz, bold)}</w:p>`);
    this.addLines(text === '' ? 1 : this.textLines(text, left));
  }
  blank(left = 0) { this.para('', { left }); }
  bullet(text, numId, bold = false) {
    this.push(`<w:p><w:pPr><w:pStyle w:val="ab"/><w:numPr><w:ilvl w:val="0"/><w:numId w:val="${numId}"/></w:numPr><w:spacing w:line="360" w:lineRule="auto"/><w:ind w:leftChars="0"/><w:jc w:val="both"/>${rpr(28, bold)}</w:pPr>${run(text, 28, bold)}</w:p>`);
    this.addLines(this.textLines(text, 480));
  }
  pagebreak() { this.push('<w:p><w:r><w:br w:type="page"/></w:r></w:p>'); this.newPage(); }
  table(idx) { return this.tlib[idx].cloneNode(true); }
  pushTable(tbl, rows) { this.push(ser(tbl)); this.addLines(rows * 1.15); }
  blocks(text) {
    for (const raw of String(text || '').split('\n')) {
      const l = raw.replace(/\s+$/, '');
      if (l.trim() === '') { this.blank(); continue; }
      let m;
      if ((m = l.match(/^##\s+(.*)$/))) this.h2(m[1]);
      else if ((m = l.match(/^\+\+\s+(.*)$/))) this.bullet(m[1], 15, true);
      else if ((m = l.match(/^\+\s+(.*)$/))) this.bullet(m[1], 48);
      else if ((m = l.match(/^o\s+(.*)$/))) this.bullet(m[1], 28);
      else if ((m = l.match(/^>\s+(.*)$/))) this.bullet(m[1], 47, true);
      else if ((m = l.match(/^::\s+(.*)$/))) this.para(m[1], { left: 1047 });
      else if ((m = l.match(/^:\s+(.*)$/))) this.para(m[1], { left: 960 });
      else if ((m = l.match(/^~\s+(.*)$/))) this.para(m[1], { left: 567 });
      else this.para(l.trim());
    }
  }
}

  const blob = await zip.generateAsync({ type: 'blob', mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });

function importFrag(doc, xml) {
  const d = parseXml(`<root ${NSW}>${xml}</root>`);
  const err = d.getElementsByTagName('parsererror')[0];

  return [...d.documentElement.children].map(c => doc.importNode(c, true));
}

function buildToc(doc, sdt, heads, shift) {
  const content = wq(sdt, 'sdtContent')[0];
  [...content.children].forEach(c => content.removeChild(c));
  const parts = heads.map((h, i) => {
    const style = h.level === 1 ? '12' : '21';
    const tabs = h.level === 1 ? '<w:tab w:val="right" w:leader="dot" w:pos="8296"/>' : '<w:tab w:val="left" w:pos="720"/><w:tab w:val="right" w:leader="dot" w:pos="8296"/>';
    const pre = i === 0 ? '<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:instrText xml:space="preserve"> TOC \\o "1-3" \\h \\z \\u </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r>' : '';
    const numrun = h.level === 2 ? `<w:r><w:rPr><w:noProof/></w:rPr><w:t>${esc(h.numText)}</w:t></w:r><w:r><w:rPr><w:noProof/></w:rPr><w:tab/></w:r>` : '';
    const pg = Math.max(1, h.page + shift);
    const hid = '<w:rPr><w:noProof/><w:webHidden/></w:rPr>';
    return `<w:p><w:pPr><w:pStyle w:val="${style}"/><w:tabs>${tabs}</w:tabs></w:pPr>${pre}<w:hyperlink w:anchor="${h.name}" w:history="1">${numrun}<w:r><w:rPr><w:noProof/></w:rPr><w:t>${esc(h.text)}</w:t></w:r><w:r>${hid}<w:tab/></w:r><w:r>${hid}<w:fldChar w:fldCharType="begin"/></w:r><w:r>${hid}<w:instrText xml:space="preserve"> PAGEREF ${h.name} \\h </w:instrText></w:r><w:r>${hid}<w:fldChar w:fldCharType="separate"/></w:r><w:r>${hid}<w:t>${pg}</w:t></w:r><w:r>${hid}<w:fldChar w:fldCharType="end"/></w:r></w:hyperlink></w:p>`;
  });
  parts.push('<w:p><w:r><w:fldChar w:fldCharType="end"/></w:r></w:p>');
  importFrag(doc, parts.join('')).forEach(n => content.appendChild(n));
}

function applyFormat(doc) {
  doc.getElementsByTagNameNS(W, 'rFonts');
  for (const rf of [...doc.getElementsByTagNameNS(W, 'rFonts')]) {
    [...rf.attributes].forEach(a => rf.removeAttributeNode(a));
    ['ascii', 'eastAsia', 'hAnsi', 'cs'].forEach(a => rf.setAttributeNS(W, 'w:' + a, '標楷體'));
  }
  const after = new Set(['ind', 'contextualSpacing', 'mirrorIndents', 'suppressOverlap', 'jc', 'textDirection', 'textAlignment', 'textboxTightWrap', 'outlineLvl', 'divId', 'cnfStyle', 'rPr', 'sectPr', 'pPrChange']);
  for (const p of [...doc.getElementsByTagNameNS(W, 'p')]) {
    let ppr = wq(p, 'pPr')[0];
    if (!ppr) { ppr = doc.createElementNS(W, 'w:pPr'); p.insertBefore(ppr, p.firstChild); }
    const sizes = [...p.getElementsByTagNameNS(W, 'sz')].map(e => +e.getAttributeNS(W, 'val'));
    let big = sizes.length && Math.max(...sizes) > 28;
    const ps = wq(ppr, 'pStyle')[0]; if (ps && ps.getAttributeNS(W, 'val') === '1') big = true;
    let sp = wq(ppr, 'spacing')[0];
    if (!sp) {
      sp = doc.createElementNS(W, 'w:spacing');
      const anchor = [...ppr.children].find(c => after.has(c.localName));
      anchor ? ppr.insertBefore(sp, anchor) : ppr.appendChild(sp);
    }
    sp.setAttributeNS(W, 'w:line', '400'); sp.setAttributeNS(W, 'w:lineRule', big ? 'atLeast' : 'exact');
  }
}

  need.forEach(([p, n]) => { if (!String(get(S, p) || '').trim()) miss.push(n); });
  const uses = S.loan.uses.filter(u => u.enabled);
  if (!uses.length) miss.push('至少勾選一項貸款用途');
  uses.forEach(u => { if (!+u.loan_amount) miss.push(`${u.category}貸款金額`); if (!+u.years) miss.push(`${u.category}年限`); });
  S.financial.years.forEach((y, i) => { if (!y.label || !+y.revenue) miss.push(`第${i + 1}年度標籤/營收`); });
  if (!+S.loan.rate_pct) miss.push('年利率');
  return miss;
}
async function onGenerate() {
  const miss = validate();
  if (miss.length) { toast('尚缺:' + miss.slice(0, 6).join('、') + (miss.length > 6 ? '…' : '')); return; }
  const btn = $('#gen'); btn.disabled = true; btn.textContent = '產生中…';
  try {
    const data = JSON.parse(JSON.stringify(S));
    const { blob, summary } = await generate(data, assets);
    const a = el('a', { href: URL.createObjectURL(blob), download: `${S.company.name}_青年創業貸款企劃書.docx` });
    document.body.append(a); a.click(); a.remove();
    $('#sum').textContent = `已產生。月還款 ${money(summary.monthly)} 元(年還款 ${money(summary.annual)} 元);` + summary.rows.map(r => `${r.label} 淨利 ${money(r.net)}(${pct(r.margin)})`).join('、') + '。目錄頁碼於 Word 開啟時按「是」更新。';
  } catch (e) { console.error(e); toast('產生失敗:' + e.message); }
  btn.disabled = false; btn.textContent = '產生 Word 檔';
}

async function init() {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  assets = { template: b64(window.__TEMPLATE_B64__), tables: new TextDecoder().decode(b64(window.__TABLES_B64__)) };
  loadLib(); const ids = Object.keys(lib);
  if (ids.length) { curId = ids.sort((a, b) => lib[b].updated - lib[a].updated)[0]; S = lib[curId].data; } else { newCaseNow(); }
  refreshCaseBar(); render();
  $('#caseSel').addEventListener('change', e => { curId = e.target.value; S = lib[curId].data; render(); });
  $('#newBtn').addEventListener('click', newCaseNow);
  $('#dupBtn').addEventListener('click', () => { const d = JSON.parse(JSON.stringify(S)); d.company.name = d.company.name + '(複製)'; curId = 'c' + Date.now(); S = d; saveLib(); refreshCaseBar(); render(); });
  $('#delBtn').addEventListener('click', () => { if (!confirm('刪除此案件?')) return; delete lib[curId]; localStorage.setItem(LS, JSON.stringify(lib)); const r = Object.keys(lib); if (r.length) { curId = r[0]; S = lib[curId].data; refreshCaseBar(); render(); } else newCaseNow(); });
  $('#expBtn').addEventListener('click', () => { const a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })), download: `${S.company.name || '案件'}.json` }); document.body.append(a); a.click(); a.remove(); });
  $('#impFile').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const d = JSON.parse(await f.text()); curId = 'c' + Date.now(); S = Object.assign(newCase(), d); saveLib(); refreshCaseBar(); render(); toast('已匯入'); } catch (er) { toast('檔案格式錯誤'); } e.target.value = ''; });
  $('#gen').addEventListener('click', onGenerate);
  window.__test = { generate, assets: () => assets, get S() { return S; }, set S(v) { S = v; } };
}
window.addEventListener('DOMContentLoaded', init);

</script></body></html>
